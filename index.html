<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&display=swap" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
    <title>Каталог настільних ігор</title>
    <script src="js/script.js" defer></script>
</head>
<body>
<header id="header-main">
    <h1>Каталог настільних ігор</h1>
    <nav>
        <a class="nav-category-button" href="#strategy">Стратегії</a>
        <a class="nav-category-button" href="#party">Для вечірок</a>
        <a class="nav-category-button" href="#family">Сімейні</a>
    </nav>
</header>
<main>
    <section class="filters" id="filters-form-games-main">
        <h2>Фільтри</h2>
        <form action="#" id="filters-form-games" method="get">
            <h3>Фільтри для ігор</h3>
            <div class="filters-form-games-buttons">
                <p>
                    <label for="search-game">Пошук за назвою:</label>
                    <input id="search-game" name="query" placeholder="Введіть назву гри" type="text">
                </p>
                <label class="filter-button" for="players-2">
                    <input id="players-2" name="playerCategory" type="radio" value="2">
                    2 гравців
                </label>
                <label class="filter-button" for="players-3-4">
                    <input id="players-3-4" name="playerCategory" type="radio" value="3-4">
                    3–4 гравці
                </label>
                <label class="filter-button" for="players-5-plus">
                    <input id="players-5-plus" name="playerCategory" type="radio" value="5+">
                    5+ гравців
                </label>
                <p>
                    <label for="players-count-filter">Кількість гравців:</label>
                    <select id="players-count-filter" name="players">
                        <option value="">Усі варіанти</option>
                        <option value="1">1 гравець</option>
                        <option value="2">2 гравці</option>
                        <option value="3">3 гравці</option>
                        <option value="4">4 гравці</option>
                        <option value="5">5 гравців</option>
                        <option value="6">6 гравців</option>
                        <option value="7">7 гравців</option>
                        <option value="8">8 гравців</option>
                    </select>
                </p>
                <button type="submit">Застосувати</button>
            </div>
        </form>
    </section>
    <section class="filters" id="add-game-section">
        <h2>Додати гру</h2>
        <form action="#" id="add-game-form">
            <div class="game-form-fields">
                <div class="game-form-field">
                    <label for="game-title">Назва гри:</label>
                    <input id="game-title" name="title" required type="text">
                </div>
                <div class="game-form-field">
                    <label for="min-players">Мінімум гравців:</label>
                    <input id="min-players" min="1" name="minPlayers" required step="1" type="number">
                </div>
                <div class="game-form-field">
                    <label for="max-players">Максимум гравців:</label>
                    <input id="max-players" min="1" name="maxPlayers" required step="1" type="number">
                </div>
                <div class="game-form-field">
                    <label for="game-genre">Жанр:</label>
                    <select id="game-genre" name="genre" required>
                        <option disabled selected value="">Оберіть жанр</option>
                        <option value="Стратегія">Стратегія</option>
                        <option value="Для вечірок">Для вечірок</option>
                        <option value="Сімейна гра">Сімейна гра</option>
                        <option value="Кооперативна гра">Кооперативна гра</option>
                    </select>
                </div>
            </div>
            <p aria-live="polite" class="form-error" id="players-range-error" role="alert"></p>
            <button type="submit">Додати гру</button>
        </form>
    </section>
    <section>
        <h2>Ігри</h2>
        <div class="game-cards-container" id="games-list">
            <article class="game-card" id="game-placeholder" aria-hidden="true">
                <h3>Каталог завантажується…</h3>
                <p class="badge game-players">Ігри з'являться після запуску JavaScript.</p>
            </article>
        </div>
        <p id="games-count" aria-live="polite">Кількість ігор у списку: 0</p>
    </section>
</main>
<footer>
    Бородін Олександр ІП-54
</footer>
</body>
</html>
