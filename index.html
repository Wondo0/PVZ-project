<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&display=swap" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
    <title>Каталог настільних ігор</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="js/script.js" defer></script>
</head>
<body>
<header id="header-main">
    <h1>Каталог настільних ігор</h1>
    <nav>
        <a class="nav-category-button" href="#/" data-link>Усі ігри</a>
        <a class="nav-category-button" href="#/owned" data-link>У колекції</a>
    </nav>
</header>
<main id="app">
    <template v-if="page === 'list'">
    <section class="filters" id="filters-form-games-main">
        <h2>Фільтри</h2>
        <form action="#" id="filters-form-games" method="get" @submit.prevent>
            <h3>Фільтри для ігор</h3>
            <div class="filters-form-games-buttons">
                <p>
                    <label for="search-game">Пошук за назвою:</label>
                    <input id="search-game" name="query" placeholder="Введіть назву гри" type="text" v-model="search">
                </p>
                <label class="filter-button" for="players-2">
                    <input id="players-2" name="playerCategory" type="radio" value="2" v-model="playerCategory" @change="playersCount = ''">
                    2 гравців
                </label>
                <label class="filter-button" for="players-3-4">
                    <input id="players-3-4" name="playerCategory" type="radio" value="3-4" v-model="playerCategory" @change="playersCount = ''">
                    3–4 гравці
                </label>
                <label class="filter-button" for="players-5-plus">
                    <input id="players-5-plus" name="playerCategory" type="radio" value="5+" v-model="playerCategory" @change="playersCount = ''">
                    5+ гравців
                </label>
                <p>
                    <label for="players-count-filter">Кількість гравців:</label>
                    <select id="players-count-filter" name="players" v-model="playersCount" @change="playerCategory = ''">
                        <option value="">Усі варіанти</option>
                        <option value="1">1 гравець</option>
                        <option value="2">2 гравці</option>
                        <option value="3">3 гравці</option>
                        <option value="4">4 гравці</option>
                        <option value="5">5 гравців</option>
                        <option value="6">6 гравців</option>
                        <option value="7">7 гравців</option>
                        <option value="8">8 гравців</option>
                    </select>
                </p>
                <button type="submit">Застосувати</button>
            </div>
        </form>
    </section>
    <section class="filters" id="add-game-section">
        <h2>Додати гру</h2>
        <form action="#" id="add-game-form" @submit.prevent="addGame">
            <div class="game-form-fields">
                <div class="game-form-field">
                    <label for="game-title">Назва гри:</label>
                    <input id="game-title" name="title" required type="text" v-model.trim="newGame.title">
                </div>
                <div class="game-form-field">
                    <label for="min-players">Мінімум гравців:</label>
                    <input id="min-players" min="1" name="minPlayers" required step="1" type="number" v-model.number="newGame.minPlayers">
                </div>
                <div class="game-form-field">
                    <label for="max-players">Максимум гравців:</label>
                    <input id="max-players" min="1" name="maxPlayers" required step="1" type="number" v-model.number="newGame.maxPlayers">
                </div>
                <div class="game-form-field">
                    <label for="game-duration">Тривалість (хв):</label>
                    <input id="game-duration" min="1" name="duration" required step="1" type="number" v-model.number="newGame.duration">
                </div>
                <div class="game-form-field">
                    <label for="game-genre">Жанр:</label>
                    <select id="game-genre" name="genre" required v-model="newGame.genre">
                        <option disabled selected value="">Оберіть жанр</option>
                        <option value="Стратегія">Стратегія</option>
                        <option value="Для вечірок">Для вечірок</option>
                        <option value="Сімейна гра">Сімейна гра</option>
                        <option value="Кооперативна гра">Кооперативна гра</option>
                    </select>
                </div>
                <div class="game-form-field game-form-checkbox">
                    <input id="game-owned" name="owned" type="checkbox" v-model="newGame.owned">
                    <label for="game-owned">Є в колекції</label>
                </div>
            </div>
            <p class="form-error" id="players-range-error" role="alert" v-if="playersRangeError">{{ playersRangeError }}</p>
            <button type="submit">Додати гру</button>
        </form>
    </section>
    <section>
        <h2>{{ ownedOnly ? 'Ігри в колекції' : 'Ігри' }}</h2>
        <div class="games-toolbar">
            <button type="button" :disabled="loading" @click="loadData">Оновити</button>
            <p class="status-message" role="status" v-if="loading">Завантаження…</p>
        </div>
        <p class="error-message" role="alert" v-if="loadError">{{ loadError }}</p>
        <p v-if="genreFilter">
            Жанр: {{ genreFilter }}
            <button class="reset-genre" type="button" @click="genreFilter = ''">Скинути жанр</button>
        </p>
        <p class="form-error" id="db-error" role="alert" v-if="dbError">{{ dbError }}</p>
        <p v-if="gameOfDay">
            Гра дня: {{ gameOfDay.title }}
            <button class="highlight-toggle" type="button" @click="highlightPaused = !highlightPaused">
                {{ highlightPaused ? 'Запустити підсвічування' : 'Зупинити підсвічування' }}
            </button>
        </p>
        <transition-group name="game-list" tag="div" class="game-cards-container" id="games-list"
                          :class="{ 'highlight-paused': highlightPaused }">
            <game-card v-for="game in filteredGames" :key="game.id" :id="game.id"
                       :title="game.title" :min-players="game.minPlayers" :max-players="game.maxPlayers"
                       :duration="game.duration" :owned="game.owned" :played="game.played"
                       :genre="game.genre" :image="game.image" :fits="fitsCurrentPlayerSelection(game)"
                       :featured="game === gameOfDay"
                       @filter="genreFilter = $event"
                       @toggle-played="togglePlayed(game)" @remove="removeGame(game)"></game-card>
        </transition-group>
        <p id="games-count" aria-live="polite">Кількість ігор у списку: {{ filteredGames.length }}</p>
    </section>
    </template>
    <section v-if="page === 'game'">
        <p><a href="#/" data-link>← До списку ігор</a></p>
        <h2>Деталі гри</h2>
        <game-card v-if="currentGame" :id="currentGame.id"
                   :title="currentGame.title" :min-players="currentGame.minPlayers" :max-players="currentGame.maxPlayers"
                   :duration="currentGame.duration" :owned="currentGame.owned" :played="currentGame.played"
                   :genre="currentGame.genre" :image="currentGame.image"
                   @toggle-played="togglePlayed(currentGame)" @remove="removeGame(currentGame)"></game-card>
        <p v-else>Гру не знайдено.</p>
    </section>
    <section v-if="page === 'not-found'">
        <h2>Сторінку не знайдено</h2>
        <p><a href="#/" data-link>На головну</a></p>
    </section>
</main>
<footer>
    Бородін Олександр ІП-54
</footer>
</body>
</html>
