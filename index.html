<!DOCTYPE html>
<html lang="uk">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Каталог настільних ігор</title>
    </head>
    <body>
        <header id="header">
            <h1>
                «Каталог настільних ігор»
            </h1>
            <nav>
                <a href="#strategy">Стратегії</a>
                <a href="#party">Для вечірок</a>
                <a href="#family">Сімейні</a>
            </nav>
        </header>
        <main>
            <section id="filters">
                <h2>Фільтри</h2>
                <form action="#" method="get">
                    <h3>Фільтри для ігор</h3>
                    <input type="radio" id="players-2" name="players" value="2">
                    <label for="players-2">Для 2 гравців</label>
                    <input type="radio" id="players-3-4" name="players" value="3-4">
                    <label for="players-3-4">3–4 гравці</label>
                    <input type="radio" id="players-5-plus" name="players" value="5+">
                    <label for="players-5-plus">5+ гравців</label>

                    <p>
                        <label for="search-game">Пошук за назвою:</label>
                        <input type="text" id="search-game" name="query" placeholder="Введіть назву гри">
                    </p>

                    <button type="submit">Застосувати</button>
                </form>
            </section>
            <section id="games">
                <h2>Ігри</h2>
                <article id="game-1">
                    <img src="" alt="Зображення гри 1">
                    <h3>Гра 1</h3>
                </article>
                <article id="game-2">
                    <img src="" alt="Зображення гри 2">
                    <h3>Гра 2</h3>
                </article>
                <article id="game-3">
                    <img src="" alt="Зображення гри 3">
                    <h3>Гра 3</h3>
                </article>
            </section>
        </main>
        <footer>
            Бородін Олександр ІП-54
        </footer>
    </body>
</html>
